name: ASP.NET Core MVC build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore "Jersey-ecommerce/Jersey-ecommerce.csproj"
      - name: Build MVC and Razor views
        run: dotnet build "Jersey-ecommerce/Jersey-ecommerce.csproj" -c Release --no-restore -p:RazorCompileOnBuild=true
      - name: Verify EF Core migration model snapshot
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.13
          dotnet ef migrations has-pending-model-changes --project "Jersey-ecommerce/Jersey-ecommerce.csproj" --context ApplicationDbContext --no-build --configuration Release
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Diagnostic: generating the EF model difference in the ephemeral CI workspace only"
            dotnet ef migrations add DiagnosticPendingModel --project "Jersey-ecommerce/Jersey-ecommerce.csproj" --context ApplicationDbContext --no-build --configuration Release --output-dir Migrations/Diagnostics
            $diagnostic = Get-ChildItem "Jersey-ecommerce/Migrations/Diagnostics" -Filter "*_DiagnosticPendingModel.cs" | Select-Object -First 1
            if ($diagnostic) { Get-Content $diagnostic.FullName }
            exit 1
          }
      - name: Validate deployable SQL Server migration script
        shell: pwsh
        run: |
          $path = Join-Path $env:RUNNER_TEMP "panenka-migrations.sql"
          dotnet ef migrations script --idempotent --project "Jersey-ecommerce/Jersey-ecommerce.csproj" --context ApplicationDbContext --no-build --configuration Release --output $path
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sql = Get-Content -LiteralPath $path -Raw
          if (-not $sql.Contains("AdminNotifications") -or -not $sql.Contains("AdminNotificationReads")) {
            throw "Expected additive notification tables are missing from the SQL deployment script."
          }
      - name: Validate bKash checkout modal JavaScript
        shell: pwsh
        run: |
          $source = Get-Content -Raw "Jersey-ecommerce/Views/Checkout/Payment.cshtml"
          $match = [regex]::Match($source, '(?s)<script>\s*(.*?)\s*</script>')
          if (-not $match.Success) { throw "Checkout modal script not found." }
          $path = Join-Path $env:RUNNER_TEMP "panenka-bkash-checkout.js"
          Set-Content -LiteralPath $path -Value $match.Groups[1].Value -Encoding UTF8
          node --check $path
      - name: Test catalog, filters, cart and URL generation
        run: dotnet test "tests/Paneka.Tests/Paneka.Tests.csproj" -c Release --logger "console;verbosity=normal"
